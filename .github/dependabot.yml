version: 2
updates:
  # Python updates.
  - package-ecosystem: "pip"
    directories: ["/"]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Madrid"
    cooldown:
      default-days: 7

  # Dockerfile updates.
  - package-ecosystem: "docker"
    directories: ["/"]
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Madrid"
    cooldown:
      default-days: 7

  # GitHub Actions workflow updates.
  - package-ecosystem: "github-actions"
    directories: ["/"]
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Madrid"
    cooldown:
      default-days: 7
