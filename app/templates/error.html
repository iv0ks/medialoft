<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Medialoft — Error {{ status }}</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32.png') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">▚</span>
            <span class="brand-name">Medialoft</span>
            <span class="brand-tag">CDN</span>
        </div>
        <nav class="topnav">
            <a href="/">Library</a>
        </nav>
    </header>

    <section class="error-panel">
        <p class="error-code">{{ status }}</p>
        <p class="error-message">{{ message }}</p>
        <p><a class="back" href="/">← Back to the library</a></p>
    </section>

    <footer class="footer">
        <span class="muted">Medialoft</span>
    </footer>
</body>
</html>
